name: Release

# Push a tag like v1.1.0 (it must match VERSIONE in config.py) to build the
# Windows executable and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check that the tag matches the game version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python -c "import sys, config; t = sys.argv[1]; sys.exit(0 if t == 'v' + config.VERSIONE else f'Tag {t} does not match VERSIONE {config.VERSIONE} in config.py')" "$GITHUB_REF_NAME"
      - name: Build (tests + PyInstaller)
        shell: cmd
        env:
          BUILD_PYTHON: python
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: WhoWantsToBeAnExplorer-windows
          path: dist/WhoWantsToBeAnExplorer.exe
          if-no-files-found: error
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/WhoWantsToBeAnExplorer.exe --title "WhoWantsToBeAnExplorer $GITHUB_REF_NAME" --generate-notes
